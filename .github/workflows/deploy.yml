name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'resumeTailorer/**'
      - 'coverLetterAdapter/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build home
        run: npm ci && npm run build

      - name: Build resumeTailorer
        run: npm ci && npm run build
        working-directory: resumeTailorer

      - name: Build coverLetterAdapter
        run: npm ci && npm run build
        working-directory: coverLetterAdapter

      - name: Assemble pages artifact
        run: |
          mkdir -p pages
          cp -r dist/. pages/
          cp -r resumeTailorer/dist pages/resumeTailorer
          cp -r coverLetterAdapter/dist pages/coverLetterAdapter

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - id: deployment
        uses: actions/deploy-pages@v4
